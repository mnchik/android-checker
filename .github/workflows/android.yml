name: android-checker

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - 323266_hello_button
          - 323267_textview_edittext_button
          - 323269_calculator
          - 323270_count_ontextchanged
          - 323271_simple_button
          - 323272_edittext_to_textview
          - 323273_count_clicks
          - 323274_autochange
          - 317613_logcat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - uses: android-actions/setup-android@v3

      - name: SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-27" "platforms;android-28" "build-tools;27.0.3" "build-tools;28.0.3" "platform-tools"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator + tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86
          target: default
          disable-animations: true
          script: bash ./run.sh ${{ matrix.task }}

      - name: Show CHECKER lines
        if: always()
        run: |
          echo "### ${{ matrix.task }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "out/${{ matrix.task }}.txt" ]; then
            cat "out/${{ matrix.task }}.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do echo "::notice title=CHECKER ${{ matrix.task }}::$line"; done < "out/${{ matrix.task }}.txt"
          else
            echo "no CHECKER output" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.task }}
          path: out/
