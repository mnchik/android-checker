name: android-checker

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - 323272_edittext_to_textview
          - 590197_lifecycle
          - 590320_grid_click
          - 590760_spinner_dynamic
          - 736672_perm_camera_button
          - 736666_perm_camera_simple
          - 399885_radix
          - 402812_text_editor
          - 713651_perm_normal_simple
          - 713668_notif_simple
          - 713680_notif_data
          - 713681_notif_click
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: SDK packages
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-27" "platforms;android-28" "platforms;android-29" "platforms;android-30" "build-tools;29.0.3" "build-tools;30.0.3" "build-tools;27.0.3" "build-tools;28.0.3" "platform-tools"
          java -version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator + tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86
          target: default
          disable-animations: true
          script: bash ./run.sh ${{ matrix.task }}

      - name: Show CHECKER lines
        if: always()
        run: |
          echo "### ${{ matrix.task }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "out/${{ matrix.task }}.txt" ]; then
            cat "out/${{ matrix.task }}.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do echo "::notice title=CHECKER ${{ matrix.task }}::$line"; done < "out/${{ matrix.task }}.txt"
          else
            echo "no CHECKER output" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show failures
        if: always()
        run: |
          f="out/${{ matrix.task }}.fail.txt"
          if [ -f "$f" ]; then msg=$(cut -c1-300 "$f" | head -8 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}'); echo "::notice title=FAIL ${{ matrix.task }}::$msg"; fi

      - name: Show test report
        if: always()
        run: |
          f="out/${{ matrix.task }}.gradle.txt"
          if [ -f "$f" ]; then
            msg=$(grep -v -E "xerces|SAXParse|base-extension|^\s+at " "$f" | grep -E "^e: |error:|FAILED|AssertionError|NoMatchingView|Exception|What went wrong|Could not|expected|Tests |tests completed|Unresolved|Manifest" | cut -c1-220 | head -14 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::notice title=GRADLE ${{ matrix.task }}::$msg"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.task }}
          path: out/
